version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: gradeflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gradeflow
      POSTGRES_USER: gradeflow
      POSTGRES_PASSWORD: gradeflow
    ports:
      - "5434:5432"
    volumes:
      - gradeflow_pgdata:/var/lib/postgresql/data

volumes:
  gradeflow_pgdata: