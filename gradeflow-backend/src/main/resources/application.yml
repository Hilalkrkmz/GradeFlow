server:
  port: 8080

spring:
  application:
    name: gradeflow-backend

  datasource:
    url: jdbc:postgresql://localhost:5434/gradeflow
    username: gradeflow
    password: gradeflow
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.gradeflow: DEBUG


app:
  jwt:
    secret: change-this-secret-in-env-it-must-be-long-enough-for-hs256-please
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
  verification:
    token-expiration-ms: 86400000
  password-reset:
    token-expiration-ms: 1800000
