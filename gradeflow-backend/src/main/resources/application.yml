server:
  port: 8080

spring:
  application:
    name: gradeflow-backend

  datasource:
    url: jdbc:postgresql://localhost:5434/gradeflow
    username: gradeflow
    password: gradeflow
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.gradeflow: DEBUG